<!doctype html>
<!--
  data-palette carries the default so the stylesheet has colors to work with
  before main.tsx runs and replaces it with the saved one. Without it the very
  first paint has every color variable undefined.
-->
<html lang="en" data-palette="tomato">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale/user-scalable suppress zooming. Safari on iOS deliberately
      ignores them for pinch-zoom (an accessibility protection) but honours them
      when the app is added to the Home Screen. Focus-zoom is prevented properly
      by the 16px minimum on form controls in styles.css, and double-tap zoom by
      `touch-action: manipulation`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pizza Tracker" />
    <!-- Rewritten to the chosen theme's background by applySettings; this is
         just the default, so the browser chrome doesn't flash a stale tint. -->
    <meta name="theme-color" content="#faf6f0" />
    <title>Pizza Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!--
      iOS ignores SVG here and falls back to a letter tile, so the home-screen
      icon must be a PNG. 180x180 is what current iPhones ask for.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
