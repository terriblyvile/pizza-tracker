# Pinned so the project doesn't inherit a name from the enclosing directory
# (which contains a space) and so resource names stay predictable.
name: pizza-tracker

services:
  pizza-tracker:
    build: .
    image: pizza-tracker
    container_name: pizza-tracker
    restart: unless-stopped

    # Loopback by default: reachable from the server itself, not from the
    # network. That's the right default because the app expects TLS to be
    # terminated in front of it and only marks its session cookie Secure when
    # the request arrives over HTTPS.
    #
    # To reach it from another machine, set BIND_ADDRESS in .env:
    #   BIND_ADDRESS=0.0.0.0     every interface (unencrypted — trusted LAN only)
    #   BIND_ADDRESS=192.168.1.5 one specific interface
    # Prefer an SSH tunnel or a TLS reverse proxy over either. See the README.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3001}:3001"

    environment:
      # Read from a .env file sitting beside this compose file. Compose loads
      # that file automatically for interpolation, and ':-' supplies an empty
      # default, so a missing .env is not a hard failure — the container starts
      # and its startup log says which values are unset.
      #
      # `env_file:` would be the more obvious way to do this, but it makes the
      # file mandatory: Compose aborts with "env file not found" before the app
      # runs at all, which is a confusing first experience.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}

      # Always bind all interfaces inside the container; the ports mapping above
      # is what actually controls exposure.
      HOST: 0.0.0.0
      PORT: 3001
      # Read the client IP and protocol from a reverse proxy's X-Forwarded-*
      # headers, so rate limiting and the Secure cookie flag behave correctly.
      TRUST_PROXY: "1"

    volumes:
      - pizza-data:/app/data

volumes:
  pizza-data:
    # Without an explicit name Compose would create "pizza-tracker_pizza-data",
    # and every `docker run -v pizza-data:...` backup command would silently
    # target a different, empty volume.
    name: pizza-data
